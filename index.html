<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control - Login</title>

    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>

<body class="dark-theme">

    <header>
        <img src="assets/images/logo2dnv.png" alt="Logo Smart Control" width="90" height="90">
        <h1>Smart Control</h1>
        <p>Painel Dashboard Interativo de Automação &amp; Telemetria</p>
    </header>

    <main>
        <section class="Login-secao">
            <h2>Entrar no sistema!</h2>
            <p id="mensagemLogin" class="mensagem-erro-login" role="alert" aria-live="assertive"></p>]

            <form id="formLogin" novalidate>
                <div>
                    <label for="emailLogin">Email:</label>
                    <input type="email" id="emailLogin" name="emailLogin" placeholder="exemplo@email.com" required autocomplete="email">
                </div>

                <div>
                    <label for="senhaLogin">Senha:</label>
                    <input type="password" id="senhaLogin" name="senhaLogin" placeholder="Digite sua senha" required autocomplete="current-password">
                </div>

                <button type="submit">Entrar</button>
            </form>

            <p class="login-ajuda">
                Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a>
            </p>

            <p class="login-ajuda">
                Precisa de ajuda? <a href="suporte.html">Fale com o suporte</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Smart Control</p>
    </footer>

    <script src="assets/js/main.js"></script>

</body>
</html>
